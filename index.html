<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minesweeper</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#222;--cell:#cfd6e0;--cell-open:#eef1f5;--line:#9aa5b5;--accent:#2563eb;--bad:#dc2626;--good:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1f232b;--ink:#e8eaee;--cell:#3a4150;--cell-open:#2a2f3a;--line:#161920;--accent:#60a5fa;--bad:#f87171;--good:#4ade80}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1f232b;--ink:#e8eaee;--cell:#3a4150;--cell-open:#2a2f3a;--line:#161920;--accent:#60a5fa;--bad:#f87171;--good:#4ade80}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px;-webkit-user-select:none;user-select:none}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
p.sub{margin:0 0 14px;opacity:.65;font-size:.9rem;text-align:center}
.card{background:var(--panel);border-radius:14px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:100%}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.lcd{font:700 1.2rem ui-monospace,Menlo,monospace;background:#111;color:#ff4d4d;padding:4px 10px;border-radius:6px;min-width:64px;text-align:center}
button,select{font:inherit;color:var(--ink);background:var(--cell);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:var(--accent);color:#fff}
#face{font-size:1.4rem;padding:3px 10px}
.scroll{overflow-x:auto;max-width:100%;padding-bottom:4px}
#board{display:grid;gap:2px;width:max-content;margin:0 auto;touch-action:manipulation}
.c{width:var(--s,30px);height:var(--s,30px);display:flex;align-items:center;justify-content:center;background:var(--cell);border-radius:4px;font-weight:800;font-size:calc(var(--s,30px)*.55);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.c.o{background:var(--cell-open);box-shadow:none;cursor:default}
.c.m{background:var(--bad);color:#fff}
.c.w{background:var(--good)}
.n1{color:#2563eb}.n2{color:#16a34a}.n3{color:#dc2626}.n4{color:#7c3aed}.n5{color:#b45309}.n6{color:#0891b2}.n7{color:#111}.n8{color:#777}
#msg{height:1.4em;text-align:center;margin-top:10px;font-weight:600}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes flagpop{0%{transform:scale(.3) rotate(-25deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
@keyframes boom{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-12px,6px) rotate(-1.5deg)}20%{transform:translate(10px,-8px) rotate(1.2deg)}30%{transform:translate(-9px,-5px) rotate(-1deg)}40%{transform:translate(8px,7px) rotate(1deg)}50%{transform:translate(-6px,4px) rotate(-.6deg)}60%{transform:translate(5px,-4px) rotate(.5deg)}80%{transform:translate(-2px,2px)}}
@keyframes shake-sm{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
.c.o{animation:pop .18s ease-out}
.c.f{animation:flagpop .25s ease-out}
.c.m{animation:boom .4s both}
.shake{animation:shake .6s ease-in-out}
.shake-sm{animation:shake-sm .25s ease-in-out}
@media (prefers-reduced-motion:reduce){.shake,.shake-sm,.c,.c.o,.c.f,.c.m{animation:none!important}}
.hint{margin-top:8px;font-size:.78rem;opacity:.6;text-align:center;max-width:340px}
.lb{margin-top:14px;width:100%;min-width:240px}
.lb h2{margin:0 0 8px;font-size:1rem}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;padding:6px 4px;font-size:.8rem}
.tabs button.on{background:var(--accent);color:#fff}
.lb ol{margin:0;padding-left:1.6em;font-size:.92rem}
.lb li{padding:2px 0}
.lb li span{display:inline-block;width:calc(100% - 3.5em)}
.lb li span+span{width:3.5em;text-align:right;font-family:ui-monospace,Menlo,monospace;opacity:.8}
#entry{display:none;gap:6px;margin-top:10px}
#entry input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--cell-open);border:1px solid var(--line);border-radius:8px;padding:7px 10px;-webkit-user-select:text;user-select:text}
.lbmsg{opacity:.65;font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<h1>💣 Minesweeper</h1>
<p class="sub">Clear every safe square without hitting a mine.</p>
<div class="card">
  <div class="bar">
    <div class="lcd" id="mines">010</div>
    <button id="face" title="New game">🙂</button>
    <div class="lcd" id="time">000</div>
  </div>
  <div class="bar">
    <select id="lvl">
      <option value="9,9,10">Beginner 9×9</option>
      <option value="12,12,25">Medium 12×12</option>
      <option value="16,16,40">Expert 16×16</option>
    </select>
    <button id="flagMode">🚩 Flag mode</button>
  </div>
  <div class="scroll"><div id="board"></div></div>
  <div id="msg"></div>
  <div id="entry"><input id="nm" maxlength="16" placeholder="Your name"><button id="sub">Submit</button></div>
  <div class="lb"><h2>🏆 Leaderboard</h2><div class="tabs" id="tabs"></div><ol id="list"></ol><div class="lbmsg" id="lbmsg"></div></div>
</div>
<p class="hint">Click to reveal · right-click or Flag mode to flag · click a number to clear its neighbors once flagged.</p>
<script>
// ===== Paste your Supabase details here (Project Settings > API) =====
const SUPABASE_URL='https://sdsosqyusednwiazlkdb.supabase.co';        // e.g. https://abcdxyz.supabase.co
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkc29zcXl1c2VkbndpYXpsa2RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3OTY0NDEsImV4cCI6MjEwNzM3MjQ0MX0.6baohLY9bYlgf6GsbgX2L0Kj0wbdBTwIHHUetCL3z7c';   // the public "anon" key, NOT the service_role key
// =====================================================================
let R,C,M,g,started,over,flags,opened,timer,secs,flagMode=false;
const $=id=>document.getElementById(id), board=$('board');
const pad=n=>String(Math.max(0,n)).padStart(3,'0');
function init(){
  [R,C,M]=$('lvl').value.split(',').map(Number);
  clearInterval(timer);secs=0;started=over=false;flags=0;opened=0;
  g=Array.from({length:R},()=>Array.from({length:C},()=>({m:0,o:0,f:0,n:0})));
  const s=Math.max(22,Math.min(34,Math.floor((Math.min(innerWidth,520)-70)/C)));
  board.style.setProperty('--s',s+'px');
  board.style.gridTemplateColumns=`repeat(${C},var(--s))`;
  board.innerHTML='';
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const d=document.createElement('div');d.className='c';d.id=`c${r}_${c}`;
    d.onclick=()=>click(r,c);
    d.oncontextmenu=e=>{e.preventDefault();flag(r,c)};
    board.appendChild(d);
  }
  $('face').textContent='🙂';$('msg').textContent='';$('time').textContent='000';upd();$('entry').style.display='none';pending=null;tab=lvKey();renderTabs();loadBoard();
}
const nb=(r,c)=>{const a=[];for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const y=r+i,x=c+j;if((i||j)&&y>=0&&x>=0&&y<R&&x<C)a.push([y,x])}return a};
function place(sr,sc){
  const safe=new Set([`${sr},${sc}`,...nb(sr,sc).map(p=>p.join())]);
  let k=0;while(k<M){const r=Math.random()*R|0,c=Math.random()*C|0;
    if(!g[r][c].m&&!safe.has(`${r},${c}`)){g[r][c].m=1;k++}}
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)g[r][c].n=nb(r,c).filter(([y,x])=>g[y][x].m).length;
}
function draw(r,c){
  const t=g[r][c],d=$(`c${r}_${c}`);
  d.className='c'+(t.o?' o':'');d.textContent='';
  if(t.o&&t.m){d.className='c m';d.textContent='💣'}
  else if(t.o&&t.n){d.textContent=t.n;d.classList.add('n'+t.n)}
  else if(t.f){d.textContent='🚩';d.classList.add('f')}
}
function reveal(r,c){
  const st=[[r,c]];
  while(st.length){const [y,x]=st.pop(),t=g[y][x];
    if(t.o||t.f)continue;t.o=1;opened++;draw(y,x);
    if(!t.n&&!t.m)nb(y,x).forEach(p=>st.push(p));}
}
function click(r,c){
  if(over)return;
  const t=g[r][c];
  if(flagMode&&!t.o)return flag(r,c);
  if(t.o){ // chord
    if(t.n&&nb(r,c).filter(([y,x])=>g[y][x].f).length===t.n)nb(r,c).forEach(([y,x])=>{if(!g[y][x].f&&!g[y][x].o)hit(y,x)});
    return check();
  }
  if(t.f)return;
  if(!started){started=true;place(r,c);timer=setInterval(()=>{$('time').textContent=pad(++secs)},1000)}
  const b=opened;hit(r,c);if(opened-b>8&&!over)shake('shake-sm');check();
}
function hit(r,c){
  if(over)return;
  if(g[r][c].m){return lose(r,c)}
  reveal(r,c);
}
function flag(r,c){
  if(over||g[r][c].o)return;
  g[r][c].f^=1;flags+=g[r][c].f?1:-1;draw(r,c);upd();
}
function shake(cls){const e=document.querySelector('.card');e.classList.remove('shake','shake-sm');void e.offsetWidth;e.classList.add(cls);if(cls==='shake'&&navigator.vibrate)try{navigator.vibrate(200)}catch(_){}}
function upd(){$('mines').textContent=pad(M-flags)}
function lose(r,c){
  over=true;clearInterval(timer);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(g[y][x].m&&!g[y][x].f){g[y][x].o=1;draw(y,x);$(`c${y}_${x}`).style.animationDelay=(Math.random()*.5)+'s'}
  $(`c${r}_${c}`).style.outline='3px solid var(--ink)';shake('shake');
  $('face').textContent='😵';$('msg').textContent='Boom! Better luck next time.';
}
function check(){
  if(over||opened!==R*C-M)return;
  over=true;clearInterval(timer);
  for(let y=0;y<R;y++)for(let x=0;x<C;x++)if(g[y][x].m&&!g[y][x].f){g[y][x].f=1;draw(y,x)}
  flags=M;upd();shake('shake-sm');$('face').textContent='😎';$('msg').textContent=`You won in ${secs}s! 🎉`;offerScore();
}
$('face').onclick=init;$('lvl').onchange=init;
$('flagMode').onclick=e=>{flagMode=!flagMode;e.target.classList.toggle('on',flagMode)};
const LEVELS={'9,9,10':'beginner','12,12,25':'medium','16,16,40':'expert'};
const NAMES={beginner:'Beginner',medium:'Medium',expert:'Expert'};
const lvKey=()=>LEVELS[$('lvl').value];
const cfg=()=>!SUPABASE_URL.startsWith('YOUR_')&&!SUPABASE_KEY.startsWith('YOUR_');
const hdr={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let tab=null,pending=null;
function renderTabs(){
  const t=$('tabs');t.innerHTML='';
  Object.values(LEVELS).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k];b.className=k===tab?'on':'';b.onclick=()=>{tab=k;renderTabs();loadBoard()};t.appendChild(b)});
}
async function loadBoard(){
  const list=$('list'),m=$('lbmsg');list.innerHTML='';
  if(!cfg()){m.textContent='Leaderboard not set up yet. Add your Supabase details in index.html.';return}
  m.textContent='Loading…';
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/scores?difficulty=eq.${tab}&select=name,seconds&order=seconds.asc,created_at.asc&limit=10`,{headers:hdr});
    if(!r.ok)throw 0;
    const rows=await r.json();
    m.textContent=rows.length?'':'No times yet. Be the first!';
    rows.forEach(s=>{const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');a.textContent=s.name;b.textContent=s.seconds+'s';li.append(a,b);list.appendChild(li)});
  }catch(e){m.textContent="Couldn't load the leaderboard."}
}
function offerScore(){
  pending={difficulty:lvKey(),seconds:Math.max(1,secs)};
  tab=pending.difficulty;renderTabs();loadBoard();
  if(!cfg())return;
  let n='';try{n=localStorage.getItem('ms_name')||''}catch(_){}
  $('nm').value=n;$('entry').style.display='flex';$('sub').disabled=false;
}
$('sub').onclick=async()=>{
  const name=$('nm').value.trim().slice(0,16);
  if(!name||!pending)return;
  $('sub').disabled=true;
  try{localStorage.setItem('ms_name',name)}catch(_){}
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/scores`,{method:'POST',headers:{...hdr,Prefer:'return=minimal'},body:JSON.stringify({name,...pending})});
    if(!r.ok)throw 0;
    pending=null;$('entry').style.display='none';
  }catch(e){$('sub').disabled=false;$('lbmsg').textContent="Couldn't save your time. Try again.";return}
  loadBoard();
};
init();
</script>
</body>
</html>
